<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OTHTECH Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">

  <div class="login-only">
    <div class="logo">
      <div class="app-icon"><span>OT</span></div>
      <span class="eyebrow">Software House</span>
      <h2>Admin Panel</h2>
      <p class="tagline">Authorized personnel only</p>
    </div>

    <div class="field-group">
      <div class="field">
        <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <label class="field-label" for="adminUser">Username</label>
        <input type="text" id="adminUser" placeholder="Username" autocomplete="username" onkeydown="if(event.key==='Enter') checkAdmin()">
      </div>
      <div class="field">
        <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <label class="field-label" for="adminPass">Password</label>
        <input type="password" id="adminPass" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter') checkAdmin()">
      </div>
    </div>

    <button class="primary" onclick="checkAdmin()">Enter</button>
    <a href="index.html" class="admin-link">Back to Login</a>
  </div>

  <div id="adminResult" class="box"></div>

</div>

<script src="sript.js"></script>
</body>
</html>
